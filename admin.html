// ══════════════════════════════════════
// GITHUB API
// ══════════════════════════════════════
async function githubGet(token) {
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}?ref=${GITHUB_BRANCH}`;
  const r = await fetch(url, { headers: { Authorization: `token ${token}`, Accept: "application/vnd.github.v3+json" } });
  if (!r.ok) throw new Error("GET " + r.status);
  return r.json();
}

async function githubPush(token, data, sha) {
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
  const body = { message: "SSFC Admin: update data", content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))), branch: GITHUB_BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(url, { method: "PUT", headers: { Authorization: `token ${token}`, Accept: "application/vnd.github.v3+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || r.status); }
  return r.json();
}

function SetupPage({onDone}) {
  const [token, setToken] = useState("");
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState("");

  const test = async () => {
    if (!token.trim()) { setErr("Masukkan token dulu."); return; }
    setTesting(true); setErr("");
    try {
      await githubGet(token.trim());
      localStorage.setItem(TOKEN_KEY, token.trim());
      onDone(token.trim());
    } catch(e) {
      if (e.message.includes("404")) {
        // File belum ada, token valid tapi file perlu dibuat
        localStorage.setItem(TOKEN_KEY, token.trim());
        onDone(token.trim());
      } else {
        setErr("Token tidak valid atau tidak punya akses ke repo. (" + e.message + ")");
      }
    }
    setTesting(false);
  };

  return h("div",{style:{minHeight:"100vh",background:"#080808",display:"flex",alignItems:"center",justifyContent:"center",padding:20}},
    h("div",{style:{width:"100%",maxWidth:520}},
      h("div",{style:{background:"#e8132b",padding:"24px 32px 20px"}},

          h("br"),h("br"),
          "Cara buat token:",h("br"),
          h("span",{style:{color:"#aaa"}},"1. Buka "),h("a",{href:"https://github.com/settings/tokens/new",target:"_blank",style:{color:"#e8132b"}},"github.com/settings/tokens/new"),h("br"),
          h("span",{style:{color:"#aaa"}},"2. Centang "),h("span",{style:{color:"#fff",fontWeight:"bold"}},"repo"),h("br"),
          h("span",{style:{color:"#aaa"}},"3. Klik Generate token → copy"),

  );
}

// ══════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════
const TABS=[{id:"hero",label:"Hero"},{id:"ticker",label:"Ticker"},{id:"teams",label:"Team/Tim"},{id:"fighters",label:"Fighters"},{id:"events",label:"Events"},{id:"halloffame",label:"Hall of Fame"},{id:"changelog",label:"Changelog"},{id:"join",label:"Join"}];

function App(){
  const [page,setPage]=useState("loading"); // loading | setup | login | admin
  const [token,setToken]=useState(null);
  const [user,setUser]=useState(null);
  const [data,setData]=useState(null);
  const [activeTab,setActiveTab]=useState("hero");
  const [saveStatus,setSaveStatus]=useState(null); // null | saving | ok | err
  const [saveMsg,setSaveMsg]=useState("");
  const shaRef=useRef(null);

  useEffect(()=>{
    // Cek session
    try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY));if(s&&s.username)setUser(s.username);}catch{}
    // Cek token
    const t=localStorage.getItem(TOKEN_KEY);
    if(t){setToken(t);}
    // Load data dari localStorage
    try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)setData(JSON.parse(raw));else setData(DEFAULT_DATA);}catch{setData(DEFAULT_DATA);}

    setPage(p=>{
      const t2=localStorage.getItem(TOKEN_KEY);
      if(!t2)return"setup";
      try{const s=JSON.parse(sessionStorage.getItem(SESSION_KEY));if(s&&s.username)return"admin";}catch{}
      return"login";
    });
  },[]);

  // Fetch SHA dari GitHub saat pertama load
  useEffect(()=>{
    if(!token)return;
    githubGet(token).then(d=>{shaRef.current=d.sha;}).catch(()=>{});
  },[token]);

  const saveToGitHub=useCallback(async(newData)=>{
    if(!token){setSaveStatus("err");setSaveMsg("Token tidak ada. Setup ulang.");return;}
    setSaveStatus("saving");setSaveMsg("Menyimpan ke GitHub...");
    localStorage.setItem(STORAGE_KEY,JSON.stringify(newData));
    try{
      const res=await githubPush(token,newData,shaRef.current);
      shaRef.current=res.content.sha;
      setSaveStatus("ok");setSaveMsg("✓ Tersimpan & live di semua device!");
      setTimeout(()=>setSaveStatus(null),4000);
    }catch(e){
      setSaveStatus("err");setSaveMsg("Gagal push ke GitHub: "+e.message);
      setTimeout(()=>setSaveStatus(null),6000);
    }
  },[token]);

  const update=useCallback((section,value)=>{
    setData(prev=>{const next={...prev,[section]:value};saveToGitHub(next);return next;});
  },[saveToGitHub]);

  if(page==="loading")return h("div",{style:{minHeight:"100vh",background:"#080808",display:"flex",alignItems:"center",justifyContent:"center",color:"#e8132b",letterSpacing:4,fontSize:12}},"LOADING...");
  if(page==="setup")return h(SetupPage,{onDone:t=>{setToken(t);setPage("login");}});
  if(page==="login")return h(LoginPage,{onLogin:u=>{setUser(u);setPage("admin");}});
  if(!data)return null;

  return h("div",{style:{minHeight:"100vh",background:"#080808",color:"#fff",fontFamily:"monospace"}},
    // HEADER
    h("div",{style:{background:"#0d0d0d",borderBottom:"1px solid #1a1a1a",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:52,position:"sticky",top:0,zIndex:100}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("div",{style:{width:6,height:6,borderRadius:"50%",background:"#e8132b",animation:"pulse 2s infinite"}}),
        h("span",{style:{fontSize:13,letterSpacing:3,textTransform:"uppercase",fontWeight:"bold"}},"SSFC ",h("span",{style:{color:"#e8132b"}},"Admin")),
        h("span",{style:{fontSize:10,color:"#444",marginLeft:8}},user),
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:10}},
        saveStatus==="saving"&&h("span",{style:{fontSize:10,color:"#f5a623",letterSpacing:1,display:"flex",alignItems:"center",gap:6}},h("span",{style:{display:"inline-block",width:10,height:10,border:"1px solid #f5a623",borderTopColor:"transparent",borderRadius:"50%",animation:"spin .7s linear infinite"}}),saveMsg),
        saveStatus==="ok"&&h("span",{style:{fontSize:10,color:"#00e870",letterSpacing:1}},saveMsg),
        saveStatus==="err"&&h("span",{style:{fontSize:10,color:"#e8132b",letterSpacing:1}},saveMsg),
        h(Btn,{variant:"secondary",small:true,onClick:()=>{localStorage.removeItem(TOKEN_KEY);setToken(null);setPage("setup");}},"Ganti Token"),
        h(Btn,{variant:"danger",small:true,onClick:()=>{sessionStorage.removeItem(SESSION_KEY);setPage("login");}},"Logout"),
      )
    ),
    // BODY
    h("div",{style:{display:"grid",gridTemplateColumns:"180px 1fr",minHeight:"calc(100vh - 52px)"}},
      // SIDEBAR
      h("div",{style:{background:"#0a0a0a",borderRight:"1px solid #1a1a1a",padding:"20px 0"}},
        TABS.map(t=>h("div",{key:t.id,onClick:()=>setActiveTab(t.id),style:{padding:"10px 18px",cursor:"pointer",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:activeTab===t.id?"#fff":"#555",background:activeTab===t.id?"rgba(232,19,43,0.1)":"transparent",borderLeft:activeTab===t.id?"2px solid #e8132b":"2px solid transparent",transition:"all .2s"}},t.label)),
        h("div",{style:{margin:"20px 14px 0",padding:14,background:"rgba(0,232,112,0.04)",border:"1px solid rgba(0,232,112,0.15)",borderRadius:2}},
          h("div",{style:{fontSize:9,color:"#00e870",letterSpacing:2,textTransform:"uppercase",marginBottom:6}},"✓ Auto-Sync"),
          h("div",{style:{fontSize:10,color:"#555",lineHeight:1.7}},"Edit → simpan → otomatis push ke GitHub → semua device update."),
        )
      ),
      // CONTENT
      h("div",{style:{padding:28,overflowY:"auto"}},
        activeTab==="hero"      && h(HeroSection,     {data:data.hero,       onChange:v=>update("hero",v)}),
        activeTab==="ticker"    && h(TickerSection,   {data:data.ticker,     onChange:v=>update("ticker",v)}),
        activeTab==="teams"     && h(TeamClubsSection,{data:data["Team/clubs"],onChange:v=>update("Team/clubs",v)}),
        activeTab==="fighters"  && h(FightersSection, {data:data.fighters,   onChange:v=>update("fighters",v)}),
        activeTab==="events"    && h(EventsSection,   {data:data.events,     onChange:v=>update("events",v)}),
        activeTab==="halloffame"&& h(HallOfFameSection,{data:data.halloffame,onChange:v=>update("halloffame",v)}),
        activeTab==="changelog" && h(ChangelogSection,{data:data.changelog,  onChange:v=>update("changelog",v)}),
        activeTab==="join"      && h(JoinSection,     {data:data.join,       onChange:v=>update("join",v)}),
      )
    ),
    h("style",null,`@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,19,43,.6)}50%{box-shadow:0 0 0 6px rgba(232,19,43,0)}}@keyframes spin{to{transform:rotate(360deg)}}`)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
