  { username: "admin",    password: "fss2026" },
  { username: "xpandux",  password: "cobra123" },

const SESSION_KEY = "fss-admin-session";

function LoginPage({ onLogin }) {
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [err,  setErr]  = useState("");
  const [show, setShow] = useState(false);

  const handleLogin = () => {
    const ok = ADMIN_CREDENTIALS.find(c => c.username === user && c.password === pass);
    if (ok) {
      sessionStorage.setItem(SESSION_KEY, user);
      onLogin(user);
    } else {
      setErr("Username atau password salah.");
      setTimeout(() => setErr(""), 3000);
    }
  };

  return h("div", { style: { minHeight:"100vh", background:"#080808", display:"flex", alignItems:"center", justifyContent:"center", padding:20 } },
    h("div", { style: { width:"100%", maxWidth:420 } },
      // Header card
      h("div", { style: { background:"var(--red,#e8132b)", padding:"28px 36px 24px", marginBottom:0 } },
        h("div", { style: { fontSize:9, letterSpacing:4, textTransform:"uppercase", color:"rgba(255,255,255,0.7)", marginBottom:10 } }, "⬤ FIGHTER STATE SIDE — AKSES TERBATAS"),
        h("div", { style: { fontFamily:"'Courier New',monospace", fontWeight:"bold", fontSize:38, letterSpacing:2, lineHeight:1.05, color:"#fff", textTransform:"uppercase" } }, "LOGIN", h("br"), "REQUIRED"),
      ),
      // Form card
      h("div", { style: { background:"#0d0d0d", border:"1px solid #1a1a1a", borderTop:"none", padding:"32px 36px 36px" } },
        h("div", { style: { marginBottom:20 } },
          h("div", { style: { fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#555", marginBottom:8 } }, "USERNAME / EMAIL"),
          h("input", { value:user, onChange:e=>setUser(e.target.value), onKeyDown:e=>e.key==="Enter"&&handleLogin(),
            placeholder:"masukkan username atau email",
            style:{ width:"100%", padding:"12px 16px", background:"#111", border:"1px solid #222", color:"#fff", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box" } })
        ),
        h("div", { style: { marginBottom:24 } },
          h("div", { style: { fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#555", marginBottom:8 } }, "PASSWORD"),
          h("div", { style: { position:"relative" } },
            h("input", { type: show?"text":"password", value:pass, onChange:e=>setPass(e.target.value), onKeyDown:e=>e.key==="Enter"&&handleLogin(),
              placeholder:"••••••••",
              style:{ width:"100%", padding:"12px 16px", background:"#111", border:"1px solid #222", color:"#fff", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box", paddingRight:48 } }),
            h("span", { onClick:()=>setShow(s=>!s), style:{ position:"absolute", right:14, top:"50%", transform:"translateY(-50%)", cursor:"pointer", fontSize:14, color:"#444", userSelect:"none" } }, show?"🙈":"👁"),
          )
        ),
        err && h("div", { style:{ fontSize:11, color:"#e8132b", letterSpacing:1, marginBottom:16, padding:"8px 12px", border:"1px solid rgba(232,19,43,0.3)", background:"rgba(232,19,43,0.06)" } }, err),
        h("button", { onClick:handleLogin,
          style:{ width:"100%", padding:"14px", background:"#e8132b", color:"#fff", border:"none", fontFamily:"monospace", fontSize:11, letterSpacing:3, textTransform:"uppercase", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:8 } },
          "▶ MASUK KE WEBSITE"
        ),
        h("div", { style:{ marginTop:16, textAlign:"center", fontSize:11, color:"#333" } },
          "Belum punya akun? ",
          h("span", { style:{ color:"#e8132b", cursor:"default" } }, "Hubungi Admin →")
        ),
        h("div", { style:{ marginTop:20, textAlign:"center", fontSize:9, color:"#222", letterSpacing:2, textTransform:"uppercase" } }, "FIGHTER STATE SIDE COMMUNITY V2.8 — AKSES PRIVAT")
      )
    )
  );
}

const BADGE_OPTIONS=[{value:"b-top",label:"Top Team (Gold)"},{value:"b-rise",label:"Rising (Green)"},{value:"b-def",label:"Default (Purple)"},{value:"b-new",label:"New Force (Red)"}];
const RANK_CLASSES=[{value:"rank-gold",label:"🥇 Gold"},{value:"rank-sil",label:"🥈 Silver"},{value:"rank-bro",label:"🥉 Bronze"},{value:"",label:"★ Normal"}];
const STORAGE_KEY="fss-admin-data";

// ── Helpers ──────────────────────────────────────────────────────────────────
const s = (style) => style; // identity, just for readability

const inp = (label, value, onChange, type="text", placeholder="") =>
  h("div", {style:{marginBottom:14}},
    label && h("div",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:5}},label),
    h("input",{type,value,placeholder,onChange:e=>onChange(type==="number"?+e.target.value:e.target.value),
      style:{width:"100%",padding:"9px 12px",background:"#111",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:13,outline:"none",borderRadius:2,boxSizing:"border-box"}})
  );

const txa = (label, value, onChange, rows=3) =>
  h("div",{style:{marginBottom:14}},
    label && h("div",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:5}},label),
    h("textarea",{value,rows,onChange:e=>onChange(e.target.value),
      style:{width:"100%",padding:"9px 12px",background:"#111",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:13,outline:"none",borderRadius:2,resize:"vertical",boxSizing:"border-box"}})
  );

const sel = (label, value, onChange, options) =>
  h("div",{style:{marginBottom:14}},
    label && h("div",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:5}},label),
    h("select",{value,onChange:e=>onChange(e.target.value),
      style:{width:"100%",padding:"9px 12px",background:"#111",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:13,outline:"none",borderRadius:2}},
      options.map(o=>h("option",{key:o.value,value:o.value},o.label))
    )
  );

const Btn = ({onClick,children,variant="primary",small}) => {
  const styles={primary:{background:"#e8132b",color:"#fff",border:"none"},secondary:{background:"transparent",color:"#fff",border:"1px solid #333"},danger:{background:"transparent",color:"#e8132b",border:"1px solid rgba(232,19,43,0.4)"},success:{background:"#00a852",color:"#fff",border:"none"}};
  return h("button",{onClick,style:{...styles[variant],padding:small?"6px 14px":"9px 20px",fontFamily:"monospace",fontSize:small?10:11,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",borderRadius:2,transition:"opacity .2s"},onMouseEnter:e=>e.currentTarget.style.opacity="0.8",onMouseLeave:e=>e.currentTarget.style.opacity="1"},children);
};

const Card = ({children,style}) => h("div",{style:{background:"#111",border:"1px solid #1e1e1e",padding:20,borderRadius:3,...style}},children);
const SectionTitle = ({children}) => h("div",{style:{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#e8132b",display:"flex",alignItems:"center",gap:8,marginBottom:20}},h("span",{style:{width:16,height:1,background:"#e8132b",display:"inline-block"}}),children);
const Tag = ({children,onRemove}) => h("span",{style:{display:"inline-flex",alignItems:"center",gap:5,background:"rgba(140,140,255,.08)",border:"1px solid rgba(140,140,255,.2)",color:"#8c8cff",fontSize:10,padding:"3px 8px",borderRadius:2}},children,onRemove&&h("span",{onClick:onRemove,style:{cursor:"pointer",opacity:0.7}},"×"));

// ── Sections ─────────────────────────────────────────────────────────────────
function HeroSection({data,onChange}){
  return h("div",null,
    h(SectionTitle,null,"Hero Section"),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
      h(Card,null,
        h("div",{style:{fontSize:12,color:"#666",marginBottom:14}},"STATS COUNTER"),
        inp("Total Fighter",data.totalFighter,v=>onChange({...data,totalFighter:v}),"number"),
        inp("Fight Style",data.fightStyle,v=>onChange({...data,fightStyle:v}),"number"),
        inp("Total Matches",data.totalMatches,v=>onChange({...data,totalMatches:v}),"number"),
        inp("Discord Online Members",data.discordOnline,v=>onChange({...data,discordOnline:v}),"number"),
      ),
      h(Card,null,
        h("div",{style:{fontSize:12,color:"#666",marginBottom:14}},"KONTEN & LINK"),
        txa("Subtitle / Tagline",data.subTitle,v=>onChange({...data,subTitle:v}),3),
        inp("Discord URL",data.discordUrl,v=>onChange({...data,discordUrl:v})),
      )
    )
  );
}

function TickerSection({data,onChange}){
  const [newItem,setNewItem]=useState("");
  const add=()=>{if(!newItem.trim())return;onChange([...data,newItem.trim()]);setNewItem("");};
  return h("div",null,
    h(SectionTitle,null,"Ticker / Scrolling Banner"),
    h(Card,null,
      h("div",{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:16}},
        data.map((item,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:8,background:"#0d0d0d",border:"1px solid #1e1e1e",padding:"8px 12px",borderRadius:2}},
          h("span",{style:{color:"#444",fontSize:11,width:20}},"#"+(i+1)),
          h("input",{value:item,onChange:e=>{const n=[...data];n[i]=e.target.value;onChange(n);},style:{flex:1,background:"transparent",border:"none",color:"#ccc",fontFamily:"monospace",fontSize:12,outline:"none"}}),
          h(Btn,{variant:"danger",small:true,onClick:()=>onChange(data.filter((_,j)=>j!==i))},"×")
        ))
      ),
      h("div",{style:{display:"flex",gap:8}},
        h("input",{value:newItem,onChange:e=>setNewItem(e.target.value),onKeyDown:e=>e.key==="Enter"&&add(),placeholder:"Tambah item ticker baru...",style:{flex:1,padding:"9px 12px",background:"#0d0d0d",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:12,outline:"none",borderRadius:2}}),
        h(Btn,{onClick:add},"+ Tambah")
      )
    )
  );
}

function TeamClubsSection({data,onChange}){
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const startEdit=f=>{setEditing(f.id);setForm({...f});};
  const save=()=>{onChange(data.map(f=>f.id===editing?{...form}:f));setEditing(null);};
  const addNew=()=>{const newId=Math.max(...data.map(f=>f.id))+1;const nf={id:newId,name:"New Team",alias:"Style · Role",desc:"Deskripsi tim baru.",ko:0,wins:0,badge:"b-def",badgeLabel:"New"};onChange([...data,nf]);startEdit(nf);};
  return h("div",null,
    h(SectionTitle,null,"Team/clubs / Tim"),
    editing
      ? h(Card,null,
          h("div",{style:{fontSize:12,color:"#e8132b",marginBottom:16}},"EDIT: "+form.name),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
            h("div",null,
              inp("Nama Tim",form.name,v=>setForm({...form,name:v})),
              inp("Alias / Style",form.alias,v=>setForm({...form,alias:v})),
              txa("Deskripsi",form.desc,v=>setForm({...form,desc:v})),
            ),
            h("div",null,
              inp("Total KO",form.ko,v=>setForm({...form,ko:v}),"number"),
              inp("Match Wins",form.wins,v=>setForm({...form,wins:v}),"number"),
              sel("Badge Style",form.badge,v=>setForm({...form,badge:v}),BADGE_OPTIONS),
              inp("Badge Label",form.badgeLabel,v=>setForm({...form,badgeLabel:v})),
            )
          ),
          h("div",{style:{display:"flex",gap:8,marginTop:8}},
            h(Btn,{onClick:save,variant:"success"},"✓ Simpan"),
            h(Btn,{onClick:()=>setEditing(null),variant:"secondary"},"Batal"),
            h(Btn,{onClick:()=>{onChange(data.filter(f=>f.id!==editing));setEditing(null);},variant:"danger"},"Hapus Tim"),
          )
        )
      : h(Fragment,null,
          h("div",{style:{display:"flex",flexDirection:"column",gap:6,marginBottom:12}},
            data.map((f,i)=>h("div",{key:f.id,style:{display:"flex",alignItems:"center",gap:12,background:"#111",border:"1px solid #1e1e1e",padding:"12px 16px",borderRadius:2}},
              h("span",{style:{fontSize:11,color:"#444",width:24}},String(i+1).padStart(2,"0")),
              h("div",{style:{flex:1}},
                h("div",{style:{fontWeight:"bold",fontSize:14,color:"#fff"}},f.name),
                h("div",{style:{fontSize:10,color:"#555",marginTop:2}},f.alias),
              ),
              h("div",{style:{fontSize:12,color:"#888"}},f.ko+" KO · "+f.wins+" W"),
              h(Btn,{small:true,variant:"secondary",onClick:()=>startEdit(f)},"Edit"),
            ))
          ),
          h(Btn,{onClick:addNew},"+ Tambah Tim")
        )
  );
}

          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
            h("div",null,
              h("div",{style:{marginBottom:14}},
                h("div",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:5}},"Emoji Avatar"),
                h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
                  EMOJIS.map(e=>h("span",{key:e,onClick:()=>setForm({...form,emoji:e}),style:{fontSize:20,cursor:"pointer",padding:"4px 8px",borderRadius:2,background:form.emoji===e?"rgba(232,19,43,0.2)":"#0d0d0d",border:form.emoji===e?"1px solid #e8132b":"1px solid #222"}},e))

                inp("Stat 2 Label",form.stat2Label,v=>setForm({...form,stat2Label:v})),
                inp("Stat 2 Value",form.stat2,v=>setForm({...form,stat2:v}),"number"),

                inp("Stat 3 Value",form.stat3,v=>setForm({...form,stat3:v}),"number"),
              )
            )
          ),
          h("div",{style:{display:"flex",gap:8,marginTop:8}},

const TABS=[{id:"hero",label:"Hero"},{id:"ticker",label:"Ticker"},{id:"Team/clubs",label:"Team/clubs"},{id:"fighters",label:"Fighters"},{id:"events",label:"Events"},{id:"halloffame",label:"Hall of Fame"},{id:"changelog",label:"Changelog"},{id:"join",label:"Join"}];

function App(){
  const [data,setData]=useState(null);
  const [activeTab,setActiveTab]=useState("hero");
  const [saved,setSaved]=useState(false);
  const [loading,setLoading]=useState(true);
  const [currentUser,setCurrentUser]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);

  useEffect(()=>{
    // Cek session login
    const session=sessionStorage.getItem(SESSION_KEY);
    if(session) setCurrentUser(session);
    setAuthChecked(true);
    // Load data
    try{const raw=localStorage.getItem(STORAGE_KEY);const parsed=raw?JSON.parse(raw):DEFAULT_DATA;if(!parsed.halloffame)parsed.halloffame=DEFAULT_DATA.halloffame;setData(parsed);}
    catch{setData(DEFAULT_DATA);}
    setLoading(false);
  },[]);

  const handleLogout=()=>{
    sessionStorage.removeItem(SESSION_KEY);
    setCurrentUser(null);
  };

  const BOT_URL='https://achievements-bangkok-female-consequences.trycloudflare.com';

  const save=useCallback(newData=>{
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(newData));
      // Tampilkan saved OK langsung — data sudah aman di localStorage
      setSaved('ok');
      setTimeout(()=>setSaved(false),3000);
      // Push ke bot di background (silent — tidak ubah status UI)
      fetch(BOT_URL+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(newData)})
        .catch(()=>{}); // abaikan error bot, tidak perlu ditampilkan
    }
    catch(e){console.error("Storage error",e);}
  },[]);

  const update=useCallback((section,value)=>{
    setData(prev=>{const next={...prev,[section]:value};save(next);return next;});
  },[save]);

  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="fss-data.json";a.click();URL.revokeObjectURL(url);
  };

  const resetToDefault=()=>{
    if(!confirm("Reset semua data ke default?"))return;setData(DEFAULT_DATA);save(DEFAULT_DATA);
  };

  if(!authChecked||loading)return h("div",{style:{minHeight:"100vh",background:"#080808",display:"flex",alignItems:"center",justifyContent:"center",color:"#e8132b",letterSpacing:4,fontSize:12,textTransform:"uppercase"}},"Loading...");

  if(!currentUser) return h(LoginPage,{onLogin:u=>setCurrentUser(u)});

  return h("div",{style:{minHeight:"100vh",background:"#080808",color:"#fff",fontFamily:"monospace"}},
    // Header
    h("div",{style:{background:"#0d0d0d",borderBottom:"1px solid #1a1a1a",padding:"0 32px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,position:"sticky",top:0,zIndex:100}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("div",{style:{width:6,height:6,borderRadius:"50%",background:"#e8132b",animation:"pulse 2s infinite"}}),
        h("span",{style:{fontSize:13,letterSpacing:3,textTransform:"uppercase",fontWeight:"bold"}},
          "FSS ",h("span",{style:{color:"#e8132b"}},"Admin")
        ),
        h("span",{style:{fontSize:10,color:"#444",letterSpacing:2}},"— PANEL KONTROL WEBSITE"),
        h("span",{style:{fontSize:9,color:"#333",letterSpacing:1,marginLeft:8}},"| ",h("span",{style:{color:"#555"}},currentUser)),
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        saved==='saving'&&h("span",{style:{fontSize:10,color:"#f5a623",letterSpacing:1}},"⏳ MENYIMPAN..."),
        saved==='ok'&&h("span",{style:{fontSize:10,color:"#00e870",letterSpacing:1}},"✓ LIVE UPDATED"),
        saved==='err'&&h("span",{style:{fontSize:10,color:"#e8132b",letterSpacing:1}},"✗ BOT OFFLINE"),
        h(Btn,{variant:"secondary",small:true,onClick:exportJSON},"⬇ JSON"),
        h(Btn,{variant:"secondary",small:true,onClick:resetToDefault},"Reset"),
        h(Btn,{variant:"danger",small:true,onClick:handleLogout},"Logout"),
      )
    ),
    // Body
    h("div",{style:{display:"grid",gridTemplateColumns:"200px 1fr",minHeight:"calc(100vh - 56px)"}},
      // Sidebar
      h("div",{style:{background:"#0a0a0a",borderRight:"1px solid #1a1a1a",padding:"24px 0"}},
        h("div",{style:{padding:"0 20px 16px",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#333"}},"Sections"),
        TABS.map(t=>h("div",{key:t.id,onClick:()=>setActiveTab(t.id),style:{padding:"11px 20px",cursor:"pointer",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:activeTab===t.id?"#fff":"#555",background:activeTab===t.id?"rgba(232,19,43,0.1)":"transparent",borderLeft:activeTab===t.id?"2px solid #e8132b":"2px solid transparent",transition:"all .2s"}},t.label)),
        h("div",{style:{margin:"24px 16px 0",padding:16,background:"#111",border:"1px solid #1a1a1a",borderRadius:2}},
          h("div",{style:{fontSize:9,color:"#444",letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"How To Use"),
          h("div",{style:{fontSize:10,color:"#555",lineHeight:1.7}},"1. Edit konten di sini",h("br"),"2. Data auto-save ke browser",h("br"),"3. Klik ",h("span",{style:{color:"#e8132b"}},"Export JSON")," untuk backup",h("br"),"4. Deploy ulang website dengan data baru"),
        ),
        h("div",{style:{margin:"12px 16px 0",padding:"10px 16px",background:"rgba(232,19,43,0.05)",border:"1px solid rgba(232,19,43,0.15)",borderRadius:2}},
          h("div",{style:{fontSize:9,color:"#e8132b",letterSpacing:2,textTransform:"uppercase",marginBottom:4}},"Storage"),
          h("div",{style:{fontSize:10,color:"#555",lineHeight:1.6}},"Data tersimpan di localStorage browser ini."),
        )
      ),
      // Content
      h("div",{style:{padding:32,overflowY:"auto"}},
        activeTab==="hero"      && h(HeroSection,      {data:data.hero,      onChange:v=>update("hero",v)}),
        activeTab==="ticker"    && h(TickerSection,    {data:data.ticker,    onChange:v=>update("ticker",v)}),
        activeTab==="Team/clubs"  && h(TeamClubsSection,  {data:data["Team/clubs"],  onChange:v=>update("Team/clubs",v)}),
        activeTab==="fighters"  && h(FightersSection,  {data:data.fighters,  onChange:v=>update("fighters",v)}),
        activeTab==="events"    && h(EventsSection,    {data:data.events,    onChange:v=>update("events",v)}),
        activeTab==="changelog" && h(ChangelogSection, {data:data.changelog, onChange:v=>update("changelog",v)}),
        activeTab==="halloffame"&& h(HallOfFameSection,{data:data.halloffame,onChange:v=>update("halloffame",v)}),
        activeTab==="join"      && h(JoinSection,      {data:data.join,      onChange:v=>update("join",v)}),
      )
    ),
    h("style",null,`@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,19,43,.6)}50%{box-shadow:0 0 0 6px rgba(232,19,43,0)}}input[type=checkbox]{accent-color:#e8132b}`)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
