function LoginPage({ onLogin }) {

      onLogin(user);
    } else {
      setErr("Username atau password salah.");
      setTimeout(() => setErr(""), 3000);
    }
  };

      ),
      // Form card
      h("div", { style: { background:"#0d0d0d", border:"1px solid #1a1a1a", borderTop:"none", padding:"32px 36px 36px" } },
        h("div", { style: { marginBottom:20 } },
          h("div", { style: { fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#555", marginBottom:8 } }, "USERNAME / EMAIL"),
          h("input", { value:user, onChange:e=>setUser(e.target.value), onKeyDown:e=>e.key==="Enter"&&handleLogin(),

            style:{ width:"100%", padding:"12px 16px", background:"#111", border:"1px solid #222", color:"#fff", fontFamily:"monospace", fontSize:13, outline:"none", boxSizing:"border-box" } })

        h("div", { style: { marginBottom:24 } },
          h("div", { style: { fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#555", marginBottom:8 } }, "PASSWORD"),

const BADGE_OPTIONS=[{value:"b-top",label:"Top Team (Gold)"},{value:"b-rise",label:"Rising (Green)"},{value:"b-def",label:"Default (Purple)"},{value:"b-new",label:"New Force (Red)"}];

// ── Helpers ──────────────────────────────────────────────────────────────────
const s = (style) => style; // identity, just for readability

const inp = (label, value, onChange, type="text", placeholder="") =>
  h("div", {style:{marginBottom:14}},
    label && h("div",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:5}},label),
    h("input",{type,value,placeholder,onChange:e=>onChange(type==="number"?+e.target.value:e.target.value),
      style:{width:"100%",padding:"9px 12px",background:"#111",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:13,outline:"none",borderRadius:2,boxSizing:"border-box"}})
  );

const txa = (label, value, onChange, rows=3) =>
  h("div",{style:{marginBottom:14}},
    label && h("div",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:5}},label),
    h("textarea",{value,rows,onChange:e=>onChange(e.target.value),
      style:{width:"100%",padding:"9px 12px",background:"#111",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:13,outline:"none",borderRadius:2,resize:"vertical",boxSizing:"border-box"}})
  );

const sel = (label, value, onChange, options) =>
  h("div",{style:{marginBottom:14}},
    label && h("div",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:"#888",marginBottom:5}},label),
    h("select",{value,onChange:e=>onChange(e.target.value),
      style:{width:"100%",padding:"9px 12px",background:"#111",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:13,outline:"none",borderRadius:2}},
      options.map(o=>h("option",{key:o.value,value:o.value},o.label))
    )
  );

const Btn = ({onClick,children,variant="primary",small}) => {
  const styles={primary:{background:"#e8132b",color:"#fff",border:"none"},secondary:{background:"transparent",color:"#fff",border:"1px solid #333"},danger:{background:"transparent",color:"#e8132b",border:"1px solid rgba(232,19,43,0.4)"},success:{background:"#00a852",color:"#fff",border:"none"}};
  return h("button",{onClick,style:{...styles[variant],padding:small?"6px 14px":"9px 20px",fontFamily:"monospace",fontSize:small?10:11,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",borderRadius:2,transition:"opacity .2s"},onMouseEnter:e=>e.currentTarget.style.opacity="0.8",onMouseLeave:e=>e.currentTarget.style.opacity="1"},children);
};

const Card = ({children,style}) => h("div",{style:{background:"#111",border:"1px solid #1e1e1e",padding:20,borderRadius:3,...style}},children);
const SectionTitle = ({children}) => h("div",{style:{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#e8132b",display:"flex",alignItems:"center",gap:8,marginBottom:20}},h("span",{style:{width:16,height:1,background:"#e8132b",display:"inline-block"}}),children);
const Tag = ({children,onRemove}) => h("span",{style:{display:"inline-flex",alignItems:"center",gap:5,background:"rgba(140,140,255,.08)",border:"1px solid rgba(140,140,255,.2)",color:"#8c8cff",fontSize:10,padding:"3px 8px",borderRadius:2}},children,onRemove&&h("span",{onClick:onRemove,style:{cursor:"pointer",opacity:0.7}},"×"));

// ── Sections ─────────────────────────────────────────────────────────────────
function HeroSection({data,onChange}){
  return h("div",null,
    h(SectionTitle,null,"Hero Section"),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
      h(Card,null,
        h("div",{style:{fontSize:12,color:"#666",marginBottom:14}},"STATS COUNTER"),
        inp("Total Fighter",data.totalFighter,v=>onChange({...data,totalFighter:v}),"number"),
        inp("Fight Style",data.fightStyle,v=>onChange({...data,fightStyle:v}),"number"),
        inp("Total Matches",data.totalMatches,v=>onChange({...data,totalMatches:v}),"number"),
        inp("Discord Online Members",data.discordOnline,v=>onChange({...data,discordOnline:v}),"number"),
      ),
      h(Card,null,
        h("div",{style:{fontSize:12,color:"#666",marginBottom:14}},"KONTEN & LINK"),
        txa("Subtitle / Tagline",data.subTitle,v=>onChange({...data,subTitle:v}),3),
        inp("Discord URL",data.discordUrl,v=>onChange({...data,discordUrl:v})),
      )
    )
  );
}

function TickerSection({data,onChange}){
  const [newItem,setNewItem]=useState("");
  const add=()=>{if(!newItem.trim())return;onChange([...data,newItem.trim()]);setNewItem("");};
  return h("div",null,
    h(SectionTitle,null,"Ticker / Scrolling Banner"),
    h(Card,null,
      h("div",{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:16}},
        data.map((item,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:8,background:"#0d0d0d",border:"1px solid #1e1e1e",padding:"8px 12px",borderRadius:2}},
          h("span",{style:{color:"#444",fontSize:11,width:20}},"#"+(i+1)),
          h("input",{value:item,onChange:e=>{const n=[...data];n[i]=e.target.value;onChange(n);},style:{flex:1,background:"transparent",border:"none",color:"#ccc",fontFamily:"monospace",fontSize:12,outline:"none"}}),
          h(Btn,{variant:"danger",small:true,onClick:()=>onChange(data.filter((_,j)=>j!==i))},"×")
        ))
      ),
      h("div",{style:{display:"flex",gap:8}},
        h("input",{value:newItem,onChange:e=>setNewItem(e.target.value),onKeyDown:e=>e.key==="Enter"&&add(),placeholder:"Tambah item ticker baru...",style:{flex:1,padding:"9px 12px",background:"#0d0d0d",border:"1px solid #222",color:"#fff",fontFamily:"monospace",fontSize:12,outline:"none",borderRadius:2}}),
        h(Btn,{onClick:add},"+ Tambah")
      )
    )
  );
}

function TeamClubsSection({data,onChange}){
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({});
  const startEdit=f=>{setEditing(f.id);setForm({...f});};
  const save=()=>{onChange(data.map(f=>f.id===editing?{...form}:f));setEditing(null);};
  const addNew=()=>{const newId=Math.max(...data.map(f=>f.id))+1;const nf={id:newId,name:"New Team",alias:"Style · Role",desc:"Deskripsi tim baru.",ko:0,wins:0,badge:"b-def",badgeLabel:"New"};onChange([...data,nf]);startEdit(nf);};
  return h("div",null,
    h(SectionTitle,null,"Team/clubs / Tim"),
    editing
      ? h(Card,null,
          h("div",{style:{fontSize:12,color:"#e8132b",marginBottom:16}},"EDIT: "+form.name),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
            h("div",null,
              inp("Nama Tim",form.name,v=>setForm({...form,name:v})),
              inp("Alias / Style",form.alias,v=>setForm({...form,alias:v})),
              txa("Deskripsi",form.desc,v=>setForm({...form,desc:v})),
            ),
            h("div",null,
              inp("Total KO",form.ko,v=>setForm({...form,ko:v}),"number"),
              inp("Match Wins",form.wins,v=>setForm({...form,wins:v}),"number"),
              sel("Badge Style",form.badge,v=>setForm({...form,badge:v}),BADGE_OPTIONS),
              inp("Badge Label",form.badgeLabel,v=>setForm({...form,badgeLabel:v})),
            )
          ),
          h("div",{style:{display:"flex",gap:8,marginTop:8}},
            h(Btn,{onClick:save,variant:"success"},"✓ Simpan"),
            h(Btn,{onClick:()=>setEditing(null),variant:"secondary"},"Batal"),
            h(Btn,{onClick:()=>{onChange(data.filter(f=>f.id!==editing));setEditing(null);},variant:"danger"},"Hapus Tim"),
          )
        )
      : h(Fragment,null,
          h("div",{style:{display:"flex",flexDirection:"column",gap:6,marginBottom:12}},
            data.map((f,i)=>h("div",{key:f.id,style:{display:"flex",alignItems:"center",gap:12,background:"#111",border:"1px solid #1e1e1e",padding:"12px 16px",borderRadius:2}},
              h("span",{style:{fontSize:11,color:"#444",width:24}},String(i+1).padStart(2,"0")),
              h("div",{style:{flex:1}},
                h("div",{style:{fontWeight:"bold",fontSize:14,color:"#fff"}},f.name),
                h("div",{style:{fontSize:10,color:"#555",marginTop:2}},f.alias),
              ),
              h("div",{style:{fontSize:12,color:"#888"}},f.ko+" KO · "+f.wins+" W"),
              h(Btn,{small:true,variant:"secondary",onClick:()=>startEdit(f)},"Edit"),
            ))
          ),
          h(Btn,{onClick:addNew},"+ Tambah Tim")
        )
  );
}

const BRACKET_SIZES=[{value:4,label:"4 Fighter"},{value:8,label:"8 Fighter"},{value:16,label:"16 Fighter"}];
const BRACKET_FORMATS=[{value:"single-elim",label:"Single Elimination"}];
const BRACKET_STATUSES=[{value:"open",label:"Open Registrasi"},{value:"ongoing",label:"Sedang Berjalan"},{value:"done",label:"Selesai"}];

function generateMatches(size){
  const matches=[];
  const rounds=Math.log2(size);
  // Round 1
  const r1pairs=[];
  const seeds=Array.from({length:size},(_,i)=>i+1);
  // Standard bracket seeding: 1 vs size, 2 vs size-1, etc paired by round
  function bracket(s){
    if(s.length===2)return[[s[0],s[1]]];
    const half=s.length/2;
    const top=[];const bot=[];
    for(let i=0;i<s.length;i++){if(i%2===0)top.push(s[i]);else bot.push(s[i]);}
    const tp=bracket(top);const bp=bracket(bot);
    const res=[];
    for(let i=0;i<tp.length;i++){res.push(tp[i]);res.push(bp[i]);}
    return res;
  }
  // Simple 1v8,2v7... pairing
  for(let i=0;i<size/2;i++){r1pairs.push([i+1,size-i]);}
  r1pairs.forEach((p,i)=>{
    matches.push({id:`r1m${i+1}`,round:1,matchNum:i+1,p1Slot:p[0],p2Slot:p[1],winner:null,score:""});
  });
  // Other rounds
  let prevCount=size/2;
  for(let r=2;r<=rounds;r++){
    const count=prevCount/2;
    for(let m=1;m<=count;m++){
      matches.push({id:`r${r}m${m}`,round:r,matchNum:m,p1Slot:null,p2Slot:null,winner:null,score:""});
    }
    prevCount=count;
  }
  return matches;
}

function generateParticipants(size){
  return Array.from({length:size},(_,i)=>({slot:i+1,name:"",team:"",seed:i+1}));
}

function BracketSection({data,onChange}){
  const [view,setView]=useState("list"); // list | edit | bracket
  const [selected,setSelected]=useState(null);
  const [form,setForm]=useState({});
  const [bracketData,setBracketData]=useState(null);

  const openEdit=(b)=>{setSelected(b.id);setForm({...b,participants:[...b.participants.map(p=>({...p}))],matches:[...b.matches.map(m=>({...m}))]});setView("edit");};
  const openBracket=(b)=>{setBracketData({...b,participants:[...b.participants.map(p=>({...p}))],matches:[...b.matches.map(m=>({...m}))]});setView("bracket");};

  const saveEdit=()=>{
    onChange(data.map(b=>b.id===selected?{...form}:b));
    setView("list");
  };

  const addNew=()=>{
    const newId=data.length?Math.max(...data.map(b=>b.id))+1:1;
    const size=8;
    const nb={id:newId,name:"Bracket Baru",eventId:null,format:"single-elim",size,status:"open",createdAt:new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}),participants:generateParticipants(size),matches:generateMatches(size)};
    onChange([...data,nb]);
    setSelected(nb.id);
    setForm({...nb,participants:[...nb.participants],matches:[...nb.matches]});
    setView("edit");
  };

  const deleteBracket=(id)=>{if(!confirm("Hapus bracket ini?"))return;onChange(data.filter(b=>b.id!==id));setView("list");};

  const updateParticipant=(idx,field,val)=>{
    const ps=[...form.participants.map(p=>({...p}))];
    ps[idx]={...ps[idx],[field]:val};
    setForm({...form,participants:ps});
  };

  const changeSize=(newSize)=>{
    const ps=generateParticipants(+newSize);
    // Keep existing data
    form.participants.forEach((p,i)=>{if(i<+newSize)ps[i]={...ps[i],...p,slot:i+1};});
    setForm({...form,size:+newSize,participants:ps,matches:generateMatches(+newSize)});
  };

  // Bracket view state
  const [bMatches,setBMatches]=useState(null);
  const [bParts,setBParts]=useState(null);
  useEffect(()=>{
    if(bracketData){setBMatches([...bracketData.matches.map(m=>({...m}))]);setBParts([...bracketData.participants.map(p=>({...p}))]);}
  },[bracketData]);

  const setWinner=(matchId,winnerSlot)=>{
    const ms=[...bMatches.map(m=>({...m}))];
    const idx=ms.findIndex(m=>m.id===matchId);
    if(idx===-1)return;
    ms[idx].winner=winnerSlot;
    // Propagate to next round
    const m=ms[idx];
    const round=m.round;const matchNum=m.matchNum;
    const nextRound=round+1;
    const nextMatchIdx=Math.ceil(matchNum/2);
    const isP1=(matchNum%2!==0);
    const nextM=ms.find(x=>x.round===nextRound&&x.matchNum===nextMatchIdx);
    if(nextM){
      if(isP1)nextM.p1Slot=winnerSlot;
      else nextM.p2Slot=winnerSlot;
    }
    setBMatches(ms);
  };

  const saveBracket=()=>{
    const updated=data.map(b=>b.id===bracketData.id?{...bracketData,matches:bMatches,participants:bParts}:b);
    onChange(updated);
    setView("list");
  };

  const getParticipant=(slot)=>bParts?bParts.find(p=>p.slot===slot):null;
  const getRounds=(matches)=>{
    const maxR=Math.max(...matches.map(m=>m.round));
    const rounds=[];
    for(let r=1;r<=maxR;r++)rounds.push(matches.filter(m=>m.round===r));
    return rounds;
  };
  const roundLabel=(r,total)=>{
    if(r===total)return"FINAL";
    if(r===total-1)return"SEMI FINAL";
    if(r===total-2)return"QUARTER FINAL";
    return"ROUND "+r;
  };

  // ── LIST VIEW ──
  if(view==="list") return h("div",null,
    h(SectionTitle,null,"Bracket Turnamen"),
    data.length===0
      ? h(Card,null,h("div",{style:{textAlign:"center",color:"#444",padding:"24px 0",fontSize:12}},"Belum ada bracket. Buat yang pertama!"))
      : h("div",{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:12}},
          data.map(b=>{
            const total=b.participants.filter(p=>p.name).length;
            const done=b.matches.filter(m=>m.winner!==null).length;
            return h("div",{key:b.id,style:{background:"#111",border:"1px solid #1e1e1e",padding:"14px 18px",borderRadius:2,display:"flex",alignItems:"center",gap:16}},
              h("div",{style:{flex:1}},
                h("div",{style:{fontWeight:"bold",fontSize:14,color:"#fff",marginBottom:3}},b.name),
                h("div",{style:{fontSize:10,color:"#555"}},b.size+" Fighter · Single Elim · "+b.createdAt),
                h("div",{style:{fontSize:10,color:"#444",marginTop:4}},`${total}/${b.size} terdaftar · ${done}/${b.matches.length} match selesai`),
              ),
              h("span",{style:{fontSize:9,padding:"3px 8px",border:"1px solid",borderRadius:2,color:b.status==="ongoing"?"#f5a623":b.status==="done"?"#00e870":"#8c8cff",borderColor:b.status==="ongoing"?"rgba(245,166,35,.3)":b.status==="done"?"rgba(0,232,112,.3)":"rgba(140,140,255,.25)"}},b.status.toUpperCase()),
              h("div",{style:{display:"flex",gap:6}},
                h(Btn,{small:true,variant:"secondary",onClick:()=>openEdit(b)},"Edit"),
                h(Btn,{small:true,onClick:()=>openBracket(b)},"▶ Bracket"),
              )
            );
          })
        ),
    h(Btn,{onClick:addNew},"+ Buat Bracket")
  );

  // ── EDIT VIEW ──
  if(view==="edit") return h("div",null,
    h(SectionTitle,null,"Edit Bracket: "+form.name),
    h("div",{style:{display:"flex",flexDirection:"column",gap:16}},
      h(Card,null,
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
          h("div",null,
            inp("Nama Bracket",form.name,v=>setForm({...form,name:v})),
            sel("Ukuran",form.size,v=>changeSize(v),BRACKET_SIZES),
          ),
          h("div",null,
            inp("Tanggal Dibuat",form.createdAt,v=>setForm({...form,createdAt:v})),
            sel("Status",form.status,v=>setForm({...form,status:v}),BRACKET_STATUSES),
          )
        )
      ),
      h(Card,null,
        h("div",{style:{fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"#888",marginBottom:14}},"Peserta ("+form.size+" Fighter)"),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          form.participants.map((p,i)=>
            h("div",{key:i,style:{display:"flex",gap:8,alignItems:"center",background:"#0d0d0d",border:"1px solid #1a1a1a",padding:"8px 10px",borderRadius:2}},
              h("span",{style:{fontSize:10,color:"#e8132b",minWidth:20}},"#"+p.seed),
              h("input",{value:p.name,onChange:e=>updateParticipant(i,"name",e.target.value),placeholder:"Nama fighter",style:{flex:1,background:"transparent",border:"none",color:"#fff",fontFamily:"monospace",fontSize:12,outline:"none"}}),
              h("input",{value:p.team,onChange:e=>updateParticipant(i,"team",e.target.value),placeholder:"Tim",style:{width:110,background:"transparent",border:"none",color:"#666",fontFamily:"monospace",fontSize:11,outline:"none"}}),
            )
          )
        )
      ),
      h("div",{style:{display:"flex",gap:8}},
        h(Btn,{onClick:saveEdit,variant:"success"},"✓ Simpan"),
        h(Btn,{onClick:()=>setView("list"),variant:"secondary"},"Batal"),
        h(Btn,{onClick:()=>deleteBracket(selected),variant:"danger"},"Hapus Bracket"),
      )
    )
  );

  // ── BRACKET VIEW ──
  if(view==="bracket"&&bMatches&&bParts){
    const rounds=getRounds(bMatches);
    const totalRounds=rounds.length;
    const winner=bMatches[bMatches.length-1]?.winner;
    const winnerPart=winner?bParts.find(p=>p.slot===winner):null;
    return h("div",null,
      h(SectionTitle,null,"Bracket: "+bracketData.name),
      winnerPart&&winnerPart.name&&h("div",{style:{background:"rgba(212,163,42,.08)",border:"1px solid rgba(212,163,42,.3)",padding:"12px 20px",borderRadius:2,marginBottom:16,display:"flex",alignItems:"center",gap:12}},
        h("span",{style:{fontSize:24}},"\uD83C\uDFC6"),
        h("div",null,
          h("div",{style:{fontSize:9,color:"#d4a32a",letterSpacing:3,textTransform:"uppercase",marginBottom:2}},"Champion"),
          h("div",{style:{fontWeight:"bold",fontSize:18,color:"#fff"}},winnerPart.name),
          h("div",{style:{fontSize:11,color:"#555"}},winnerPart.team),
        )
      ),
      h("div",{style:{overflowX:"auto",paddingBottom:16}},
        h("div",{style:{display:"flex",gap:0,minWidth:"max-content"}},
          rounds.map((roundMatches,ri)=>{
            const rNum=ri+1;
            const label=roundLabel(rNum,totalRounds);
            const matchHeight=140;
            const gap=Math.pow(2,ri)*12;
            return h("div",{key:rNum,style:{display:"flex",flexDirection:"column",minWidth:200}},
              h("div",{style:{fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#e8132b",textAlign:"center",padding:"8px 0",borderBottom:"1px solid #1a1a1a",marginBottom:gap}},label),
              h("div",{style:{display:"flex",flexDirection:"column",gap:gap*2+matchHeight*(Math.pow(2,ri)-1)}},
                roundMatches.map((m,mi)=>{
                  const p1=m.p1Slot?bParts.find(p=>p.slot===m.p1Slot):null;
                  const p2=m.p2Slot?bParts.find(p=>p.slot===m.p2Slot):null;
                  const canSetWinner=m.p1Slot&&m.p2Slot&&p1?.name&&p2?.name;
                  return h("div",{key:m.id,style:{background:"#111",border:"1px solid #1e1e1e",borderRadius:2,overflow:"hidden",width:190,marginTop:mi===0?0:gap}},
                    // Match header
                    h("div",{style:{background:"#0a0a0a",padding:"4px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
                      h("span",{style:{fontSize:9,color:"#333",letterSpacing:1}},`M${m.matchNum}`),
                      m.winner&&h("span",{style:{fontSize:9,color:"#00e870",letterSpacing:1}},"✓ DONE"),
                    ),
                    // P1
                    h("div",{onClick:()=>canSetWinner&&m.winner!==m.p1Slot&&setWinner(m.id,m.p1Slot),
                      style:{padding:"8px 10px",borderBottom:"1px solid #1a1a1a",cursor:canSetWinner&&m.winner!==m.p1Slot?"pointer":"default",background:m.winner===m.p1Slot?"rgba(0,232,112,.07)":m.winner===m.p2Slot?"rgba(255,0,0,.04)":"transparent",transition:"background .15s",display:"flex",alignItems:"center",gap:8}},
                      h("span",{style:{fontSize:9,color:"#555",minWidth:16}},"S"+( m.p1Slot||"?")),
                      h("div",{style:{flex:1}},
                        h("div",{style:{fontSize:12,color:m.winner===m.p1Slot?"#00e870":p1?.name?"#fff":"#333",fontWeight:m.winner===m.p1Slot?"bold":"normal"}},p1?.name||"TBD"),
                        p1?.team&&h("div",{style:{fontSize:9,color:"#444"}},p1.team),
                      ),
                      m.winner===m.p1Slot&&h("span",{style:{fontSize:12,color:"#00e870"}},"✓"),
                    ),
                    // P2
                    h("div",{onClick:()=>canSetWinner&&m.winner!==m.p2Slot&&setWinner(m.id,m.p2Slot),
                      style:{padding:"8px 10px",cursor:canSetWinner&&m.winner!==m.p2Slot?"pointer":"default",background:m.winner===m.p2Slot?"rgba(0,232,112,.07)":m.winner===m.p1Slot?"rgba(255,0,0,.04)":"transparent",transition:"background .15s",display:"flex",alignItems:"center",gap:8}},
                      h("span",{style:{fontSize:9,color:"#555",minWidth:16}},"S"+(m.p2Slot||"?")),
                      h("div",{style:{flex:1}},
                        h("div",{style:{fontSize:12,color:m.winner===m.p2Slot?"#00e870":p2?.name?"#fff":"#333",fontWeight:m.winner===m.p2Slot?"bold":"normal"}},p2?.name||"TBD"),
                        p2?.team&&h("div",{style:{fontSize:9,color:"#444"}},p2.team),
                      ),
                      m.winner===m.p2Slot&&h("span",{style:{fontSize:12,color:"#00e870"}},"✓"),
                    ),
                  );
                })
              )
            );
          }),
          // Trophy column
          winnerPart&&winnerPart.name&&h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minWidth:80,paddingTop:40}},
            h("div",{style:{fontSize:36}},"\uD83C\uDFC6"),
          )
        )
      ),
      h("div",{style:{fontSize:10,color:"#444",marginBottom:16,letterSpacing:1}},"⬤ Klik nama fighter untuk set sebagai pemenang. Bracket otomatis update ke round berikutnya."),
      h("div",{style:{display:"flex",gap:8}},
        h(Btn,{onClick:saveBracket,variant:"success"},"✓ Simpan Hasil"),
        h(Btn,{onClick:()=>setView("list"),variant:"secondary"},"Kembali"),
      )
    );
  }

  return null;
}

const TABS=[{id:"hero",label:"Hero"},{id:"ticker",label:"Ticker"},{id:"Team/clubs",label:"Team/clubs"},{id:"fighters",label:"Fighters"},{id:"events",label:"Events"},{id:"brackets",label:"Bracket"},{id:"halloffame",label:"Hall of Fame"},{id:"changelog",label:"Changelog"},{id:"join",label:"Join"}];

function App(){
  const [data,setData]=useState(null);
  const [activeTab,setActiveTab]=useState("hero");
  const [saved,setSaved]=useState(false);
  const [loading,setLoading]=useState(true);
  const [currentUser,setCurrentUser]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);

  useEffect(()=>{
    // Cek session login
    const session=sessionStorage.getItem(SESSION_KEY);
    if(session) setCurrentUser(session);
    setAuthChecked(true);
    // Load data
    try{const raw=localStorage.getItem(STORAGE_KEY);const parsed=raw?JSON.parse(raw):DEFAULT_DATA;if(!parsed.halloffame)parsed.halloffame=DEFAULT_DATA.halloffame;if(!parsed.brackets)parsed.brackets=DEFAULT_DATA.brackets;setData(parsed);}
    catch{setData(DEFAULT_DATA);}
    setLoading(false);
  },[]);

  const handleLogout=()=>{
    sessionStorage.removeItem(SESSION_KEY);
    setCurrentUser(null);
  };

  const BOT_URL='https://paxil-odds-church-ide.trycloudflare.com';

  const save=useCallback(newData=>{
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(newData));
      setSaved('saving');
      // Push ke server — kalau berhasil semua device dapat data terbaru
      fetch(BOT_URL+'/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(newData)})
        .then(r=>{
          if(!r.ok) throw new Error('server error');
          setSaved('ok');
          setTimeout(()=>setSaved(false),3000);
        })
        .catch(()=>{
          // Server offline: data lokal aman, tapi device lain tidak akan update otomatis
          setSaved('local');
          setTimeout(()=>setSaved(false),6000);
        });
    }
    catch(e){console.error("Storage error",e);setSaved('err');}
  },[]);

  const update=useCallback((section,value)=>{
    setData(prev=>{const next={...prev,[section]:value};save(next);return next;});
  },[save]);

  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ssfc-data.json";a.click();URL.revokeObjectURL(url);
  };

  const importJSON=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!confirm('Import data JSON? Data saat ini akan diganti.'))return;
        setData(parsed);save(parsed);
      }catch(err){alert('File JSON tidak valid!');}
    };
    reader.readAsText(file);
    e.target.value='';
  };

  const resetToDefault=()=>{
    if(!confirm("Reset semua data ke default?"))return;setData(DEFAULT_DATA);save(DEFAULT_DATA);
  };

  if(!authChecked||loading)return h("div",{style:{minHeight:"100vh",background:"#080808",display:"flex",alignItems:"center",justifyContent:"center",color:"#e8132b",letterSpacing:4,fontSize:12,textTransform:"uppercase"}},"Loading...");

  if(!currentUser) return h(LoginPage,{onLogin:u=>setCurrentUser(u)});

  return h("div",{style:{minHeight:"100vh",background:"#080808",color:"#fff",fontFamily:"monospace"}},
    // Header
    h("div",{style:{background:"#0d0d0d",borderBottom:"1px solid #1a1a1a",padding:"0 32px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,position:"sticky",top:0,zIndex:100}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("div",{style:{width:6,height:6,borderRadius:"50%",background:"#e8132b",animation:"pulse 2s infinite"}}),
        h("span",{style:{fontSize:13,letterSpacing:3,textTransform:"uppercase",fontWeight:"bold"}},
          "SSFC ",h("span",{style:{color:"#e8132b"}},"Admin")
        ),
        h("span",{style:{fontSize:10,color:"#444",letterSpacing:2}},"— PANEL KONTROL WEBSITE"),
        h("span",{style:{fontSize:9,color:"#333",letterSpacing:1,marginLeft:8}},"| ",h("span",{style:{color:"#555"}},currentUser)),
      ),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        saved==='saving'&&h("span",{style:{fontSize:10,color:"#f5a623",letterSpacing:1}},"⏳ MENYIMPAN..."),
        saved==='ok'&&h("span",{style:{fontSize:10,color:"#00e870",letterSpacing:1}},"✓ TERSIMPAN & LIVE"),
        saved==='local'&&h("span",{style:{fontSize:10,color:"#f5a623",letterSpacing:1}},"⚠ TERSIMPAN LOKAL — Server offline, device lain belum update"),
        saved==='err'&&h("span",{style:{fontSize:10,color:"#e8132b",letterSpacing:1}},"✗ GAGAL SIMPAN"),
        h(Btn,{variant:"secondary",small:true,onClick:exportJSON},"⬇ Export JSON"),
        h("label",{style:{cursor:"pointer"}},
          h(Btn,{variant:"secondary",small:true,onClick:()=>document.getElementById('import-json-input').click()},"⬆ Import JSON"),
          h("input",{id:"import-json-input",type:"file",accept:".json",style:{display:"none"},onChange:importJSON})
        ),
        h(Btn,{variant:"secondary",small:true,onClick:resetToDefault},"Reset"),
        h(Btn,{variant:"danger",small:true,onClick:handleLogout},"Logout"),
      )
    ),
    // Body
    h("div",{style:{display:"grid",gridTemplateColumns:"200px 1fr",minHeight:"calc(100vh - 56px)"}},
      // Sidebar
      h("div",{style:{background:"#0a0a0a",borderRight:"1px solid #1a1a1a",padding:"24px 0"}},
        h("div",{style:{padding:"0 20px 16px",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"#333"}},"Sections"),
        TABS.map(t=>h("div",{key:t.id,onClick:()=>setActiveTab(t.id),style:{padding:"11px 20px",cursor:"pointer",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:activeTab===t.id?"#fff":"#555",background:activeTab===t.id?"rgba(232,19,43,0.1)":"transparent",borderLeft:activeTab===t.id?"2px solid #e8132b":"2px solid transparent",transition:"all .2s"}},t.label)),
        h("div",{style:{margin:"24px 16px 0",padding:16,background:"#111",border:"1px solid #1a1a1a",borderRadius:2}},
          h("div",{style:{fontSize:9,color:"#444",letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"How To Use"),
          h("div",{style:{fontSize:10,color:"#555",lineHeight:1.7}},"1. Edit konten di sini",h("br"),"2. Auto-save + sync ke server",h("br"),"3. Semua device otomatis terupdate",h("br"),"4. Server offline? Export → Import JSON"),
        ),
        h("div",{style:{margin:"12px 16px 0",padding:"10px 16px",background:"rgba(232,19,43,0.05)",border:"1px solid rgba(232,19,43,0.15)",borderRadius:2}},
          h("div",{style:{fontSize:9,color:"#e8132b",letterSpacing:2,textTransform:"uppercase",marginBottom:4}},"Storage"),
          h("div",{style:{fontSize:10,color:"#555",lineHeight:1.6}},"Data disimpan ke server (semua device sync) + localStorage sebagai backup lokal."),
        )
      ),
      // Content
      h("div",{style:{padding:32,overflowY:"auto"}},
        activeTab==="hero"      && h(HeroSection,      {data:data.hero,      onChange:v=>update("hero",v)}),
        activeTab==="ticker"    && h(TickerSection,    {data:data.ticker,    onChange:v=>update("ticker",v)}),
        activeTab==="Team/clubs"  && h(TeamClubsSection,  {data:data["Team/clubs"],  onChange:v=>update("Team/clubs",v)}),
        activeTab==="fighters"  && h(FightersSection,  {data:data.fighters,  onChange:v=>update("fighters",v)}),
        activeTab==="events"    && h(EventsSection,    {data:data.events,    onChange:v=>update("events",v)}),
        activeTab==="brackets"  && h(BracketSection,   {data:data.brackets,  onChange:v=>update("brackets",v)}),
        activeTab==="changelog" && h(ChangelogSection, {data:data.changelog, onChange:v=>update("changelog",v)}),
        activeTab==="halloffame"&& h(HallOfFameSection,{data:data.halloffame,onChange:v=>update("halloffame",v)}),
        activeTab==="join"      && h(JoinSection,      {data:data.join,      onChange:v=>update("join",v)}),
      )
    ),
    h("style",null,`@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,19,43,.6)}50%{box-shadow:0 0 0 6px rgba(232,19,43,0)}}input[type=checkbox]{accent-color:#e8132b}`)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
